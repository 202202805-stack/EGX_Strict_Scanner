name: EGX Scanner Cron

on:
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --- حفظ وقراءة ملف التكرار بين التحديثات ---
      - name: Cache Last Sent Message
        uses: actions/cache@v3
        with:
          path: last_sent.txt
          key: last-sent-msg-${{ github.run_id }}
          restore-keys: |
            last-sent-msg-

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
