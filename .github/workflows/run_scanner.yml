name: EGX Scanner Cron

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write  # إعطاء صلاحية الكتابة للحفظ في المستودع

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # --- حفظ ملف الكاش داخل المستودع لمنع التكرار نهائياً ---
      - name: Commit and Push Cache File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "update telegram message cache [skip ci]" && git push)
