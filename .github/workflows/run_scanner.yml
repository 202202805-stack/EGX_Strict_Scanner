name: Run EGX Strict Scanner

on:
  schedule:
    # هيشتغل كل يوم الساعة 7:00 الصبح بتوقيت جرينتش (يعني 9:00 الصبح بتوقيت مصر)
    - cron: '0 7 * * *'
  workflow_dispatch: # زرار لتشغيل الكود يدوياً في أي وقت للتجربة

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scanner Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python strict_scanner
